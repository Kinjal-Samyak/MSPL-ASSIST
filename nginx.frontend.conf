server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container so frontend + backend share
    # an origin from the browser's point of view. If you'd rather hit the
    # backend directly (e.g. VITE_API_BASE_URL=http://your-server:4000),
    # you can delete this block and rely on CORS_ALLOWED_ORIGINS instead.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:4000/health;
    }

    # SPA fallback — client-side router handles the rest
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
